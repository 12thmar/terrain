name: Deploy terrain to EC2 (prod)

on:
  push:
    branches: ["prod"]
    paths:
      - "backend/**"
      - "docker/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-prod.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Deploy to EC2 via SSM
        env:
          AWS_REGION: us-east-1
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_ACCESS_KEY_ID_TERRAIN: ${{ secrets.AWS_ACCESS_KEY_ID_TERRAIN }}
          AWS_SECRET_ACCESS_KEY_TERRAIN: ${{ secrets.AWS_SECRET_ACCESS_KEY_TERRAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          ENV_CONTENT=$(printf '%s\n' \
            "APP_ENV=production" \
            "APP_DEBUG=false" \
            "APP_KEY=${APP_KEY}" \
            "APP_URL=${APP_URL}" \
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
            "GOOGLE_REDIRECT_URI=${APP_URL}/auth/google/callback" \
            "ODOO_URL=${ODOO_URL}" \
            "ODOO_DB=${ODOO_DB}" \
            "ODOO_USERNAME=${ODOO_USERNAME}" \
            "ODOO_PASSWORD=${ODOO_PASSWORD}" \
            "AWS_BUCKET=${AWS_BUCKET}" \
            "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID_TERRAIN}" \
            "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY_TERRAIN}" \
            "AWS_DEFAULT_REGION=us-east-1" \
            "DATABASE_URL=${DATABASE_URL}" \
            "DB_CONNECTION=pgsql")

          ENV_B64=$(printf "%s" "$ENV_CONTENT" | base64 -w 0)
          PAT_B64=$(printf "%s" "$GH_PAT" | base64 -w 0)

          cp deploy/deploy.sh /tmp/deploy.sh
          sed -i "s|__ENV_B64__|${ENV_B64}|g" /tmp/deploy.sh
          sed -i "s|__PAT_B64__|${PAT_B64}|g" /tmp/deploy.sh

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy.sh)

          python3 -c "
          import json, sys
          script_b64 = sys.argv[1]
          params = {'commands': [
              f'echo {script_b64} | base64 -d > /tmp/terrain-deploy.sh',
              'sudo nohup bash /tmp/terrain-deploy.sh > /var/log/terrain-deploy.log 2>&1 &',
              'sleep 3',
              'echo DEPLOY_STARTED'
          ]}
          print(json.dumps(params))
          " "${SCRIPT_B64}" > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --cli-read-timeout 60

          echo "Deploy script started on EC2, polling log..."

          for i in {1..60}; do
            sleep 15
            echo "--- Poll attempt $i/60 ---"

            POLL_ID=$(aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$INSTANCE_ID" \
              --parameters '{"commands":["tail -10 /var/log/terrain-deploy.log 2>/dev/null || echo LOG_NOT_FOUND"]}' \
              --query "Command.CommandId" \
              --output text)

            sleep 5

            OUTPUT=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$POLL_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text 2>/dev/null || echo "polling...")

            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q "DEPLOYMENT FAILED\|containers not running\|ERROR:"; then
              echo "DEPLOYMENT FAILED"
              exit 1
            fi

            if echo "$OUTPUT" | grep -q "Running containers"; then
              echo "DEPLOYMENT SUCCEEDED"
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "TIMEOUT: Deploy did not complete"
              exit 1
            fi
          done
